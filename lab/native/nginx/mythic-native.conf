# Project ATMA — nginx for native Mythic. DRAFT: verify locations against
# upstream nginx-docker/config before relying on /docs and /jupyter.
# Localhost-only by default: 127.0.0.1:7443. Expose via Tailscale Serve, not by opening 7443 publicly.
server {
    listen 127.0.0.1:7443 ssl;
    server_name _;

    ssl_certificate /etc/mythic/ssl/mythic-cert.crt;
    ssl_certificate_key /etc/mythic/ssl/mythic-ssl.key;
    client_max_body_size 500M;

    # React UI (built from MythicReactUI, served as static files)
    location /new/ {
        alias /var/www/mythic-new/;
        try_files $uri $uri/ /new/index.html;
    }

    # Mythic server API — mirrors upstream nginx: /api/* -> mythic_server
    location /api/ {
        proxy_pass http://127.0.0.1:17443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # GraphQL — mirrors upstream: /graphql -> Hasura, with auth hook on the server side
    location /graphql {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /v1/graphql {
        proxy_pass http://127.0.0.1:8080/v1/graphql;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Documentation (Hugo, optional — 404 if not built)
    location /docs/ {
        alias /var/www/mythic-docs/;
        try_files $uri $uri/ =404;
    }

    location / {
        return 302 /new/;
    }
}
