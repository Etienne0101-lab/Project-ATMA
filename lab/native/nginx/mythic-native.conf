# Project ATMA — nginx for native Mythic.
# Faithful translation of upstream nginx-docker/config/templates/services.conf.template,
# with container hostnames replaced by 127.0.0.1 and ports from .env defaults.
# One difference, deliberate and documented: upstream proxies /new to a second
# nginx (mythic_react, port 3000) serving the React build from /mythic/new.
# Here the main nginx serves that same build directly from /var/www/mythic-new,
# so no second nginx is needed. All other routes match upstream.
# Localhost-only by default: 127.0.0.1:7443. Expose via Tailscale Serve, not by opening 7443 publicly.
server {
    listen 127.0.0.1:7443 ssl;
    ssl_certificate /etc/mythic/ssl/mythic-cert.crt;
    ssl_certificate_key /etc/mythic/ssl/mythic-ssl.key;
    client_max_body_size 500M;
    ssl_session_timeout 1d;
    absolute_redirect off;

    # Upstream rewrites: / and /login go to the new UI login page.
    rewrite ^/login$ /new/login permanent;
    rewrite ^/$ /new/login permanent;

    # React UI — static build from MythicReactUI, served here instead of via a second nginx on :3000.
    location /new {
        alias /var/www/mythic-new/;
        try_files $uri $uri/ /new/index.html;
    }
    location /new/ {
        alias /var/www/mythic-new/;
        try_files $uri $uri/ /new/index.html;
    }

    # Hasura GraphQL — upstream routes, with websocket upgrade for subscriptions.
    location /v1/ {
        proxy_pass http://127.0.0.1:8080/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
    }
    location /v1alpha1/ {
        proxy_pass http://127.0.0.1:8080/v1alpha1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /v2/ {
        proxy_pass http://127.0.0.1:8080/v2/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /graphql/ {
        proxy_pass http://127.0.0.1:8080/v1/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /console/ {
        proxy_pass http://127.0.0.1:8080/console/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~(/api/rest|/api/swagger) {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Documentation (Hugo, optional — 404 if not built; upstream proxies to documentation:8090)
    location /docs/ {
        alias /var/www/mythic-docs/;
        try_files $uri $uri/ =404;
    }

    # Jupyter (optional — upstream proxies to jupyter host/port; omit or add a proxy_pass here if you add Jupyter)
    # location /jupyter {
    #     proxy_pass http://127.0.0.1:8888/jupyter;
    # }

    # Everything else — upstream proxies to mythic_server (including /api/v1.4, scripting, file transfers).
    location / {
        proxy_pass http://127.0.0.1:17443;
        proxy_pass_request_headers on;
        proxy_pass_request_body on;
        proxy_http_version 1.1;
        proxy_redirect off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Port $server_port;
    }
}
